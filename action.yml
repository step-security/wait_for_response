# action.yml
name: "Wait For HTTP Responses"
author: 'step-security'
branding:
  icon: "clock"
  color: "blue"
description: "Wait for response code from a URL with timeout"
inputs:
  url:
    description: "URL to poll"
    required: false
    default: "http://localhost/"
  responseCode:
    description: "Response code to wait for"
    required: false
    default: "200"
  timeout:
    description: "Timeout before giving up in ms"
    required: false
    default: "30000"
  interval:
    description: "Interval between polling in ms"
    required: false
    default: "200"
  username:
    description: "Basic Auth Username"
    required: false
  password:
    description: "Basic Auth Password"
    required: false
outputs:
  result:
    description: "0 if response code returned within timeout, otherwise 1"
runs:
  using: "docker"
  image: "docker://ghcr.io/step-security/wait_for_response:v2.0.0@sha256:b776b81b2ebb5aa752df8df838a4480c0b601570f97866fff3294efd79840b5a" #v2.0.0
